services:
  catalogue:
    build: ./catalogue
    image: narayanareddy2026/catalogue:v1
    container_name: catalogue
  mongodb:
    build: ./mongodb
    image: narayanareddy2026/mongodb:v1
    container_name: mongodb
    volumes:
      - mongodb:/data/db
  redis:
    image: redis:7.0
    container_name: redis
    volumes:
      - redis:/data
  mysql:
    build: ./mysql
    image: narayanareddy2026/mysql:v1
    container_name: mysql
    volumes:
      - mysql:/var/lib/mysql
  rabbitmq:
    image: rabbitmq:3
    container_name: rabbitmq
    volumes:
      - rabbitmq:/var/lib/rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: roboshop
      RABBITMQ_DEFAULT_PASS: roboshop123
  user:
    build: ./user 
    image: narayanareddy2026/user:v1
    container_name: user
    depends_on:
      - redis
      - mongodb
  cart:
    build: ./cart
    image: narayanareddy2026/cart:v1
    container_name: cart
    depends_on:
      - redis
      - catalogue       
  shipping:
    build: ./shipping
    image: narayanareddy2026/shipping:v1
    container_name: shipping
    depends_on:
      - mysql
      - cart
  payment:
    build: ./payment
    image: narayanareddy2026/payment:v1
    container_name: payment
    depends_on:
      - rabbitmq
      - cart
      - user
  frontend:
    build: ./frontend
    image: narayanareddy2026/frontend:v1
    container_name: frontend
    ports:
      - "80:80"
    depends_on:
      - catalogue
      - user
      - cart
      - shipping
      - payment  



networks:
  default:
    driver: bridge
    name: roboshop
    external: false # true if you created network manually network command     
volumes:
   mongodb:
   redis:
   mysql:
   rabbitmq:
